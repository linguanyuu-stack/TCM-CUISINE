// ---------------------------------------------------------------------------
// 一起圍爐 (60 s, 16:9) — shared utilities (deterministic: everything is f(t))
// ---------------------------------------------------------------------------
'use strict';
const W = 1920, H = 1080, FPS = 24, DUR = 60;
const END_CARD = '宜康中醫｜何首烏藥膳・天麻款';
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => (t = clamp(t), t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
const easeIn = t => Math.pow(clamp(t), 3);
const easeOutBack = t => { t = clamp(t); const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const smooth = (e0, e1, x) => { x = clamp((x - e0) / (e1 - e0)); return x * x * (3 - 2 * x); };
const hump = t => Math.sin(Math.PI * clamp(t));
function hash1(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise1(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash1(i), hash1(i + 1), u) * 2 - 1; }
// damped spring response to an impulse at t0 (for follow-through: leaves, ears, cloth)
function spring(t, t0, amp, freq = 9, damp = 5) { const d = t - t0; if (d < 0) return 0; return amp * Math.exp(-d * damp) * Math.sin(d * freq); }
// keyframe track: [[t, v], ...] eased between keys
function track(keys, t, fn = ease) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 0; i < keys.length - 1; i++) { const a = keys[i], b = keys[i + 1]; if (t <= b[0]) { const u = (t - a[0]) / Math.max(1e-6, b[0] - a[0]); const f = a[2] || fn; return typeof a[1] === 'number' ? lerp(a[1], b[1], f(u)) : a[1].map((v, j) => lerp(v, b[1][j], f(u))); } }
  return keys[keys.length - 1][1];
}
const step = (keys, t) => { let v = keys[0][1]; for (const k of keys) if (t >= k[0]) v = k[1]; return v; };
function noteFreq(n) { const m = /^([A-G])(#|b)?(\d)$/.exec(n), map = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }; const s = map[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (parseInt(m[3]) + 1) * 12; return 440 * Math.pow(2, (s - 69) / 12); }

// ---------------------------------------------------------------------------
// Walk cycle with planted feet. s = distance travelled (px, world), Ls = step
// length. Each foot is fixed in world space during stance and swings 2·Ls
// while the body covers Ls. Returns per-foot offsets from the body (world px).
// Distances that end on a multiple of Ls leave both feet planted.
// ---------------------------------------------------------------------------
function gait(s, Ls, lift) {
  const k = Math.floor(s / Ls), f = s / Ls - k, e = f * f * (3 - 2 * f);
  const even = ((k % 2) + 2) % 2 === 0;
  const foot = (stanceEven) => {
    if (even === stanceEven) return { dx: k * Ls + Ls / 2 - s, lift: 0, stance: 1 };
    return { dx: lerp((k - 1) * Ls + Ls / 2, (k + 1) * Ls + Ls / 2, e) - s, lift: Math.sin(Math.PI * f) * lift, stance: 0 };
  };
  const A = foot(true), B = foot(false);   // at rest: A ahead (+Ls/2), B behind (−Ls/2)
  return {
    A, B,
    bob: Math.sin(Math.PI * f),                 // 0 at contact, 1 at passing
    contact: Math.pow(1 - Math.sin(Math.PI * f), 6), // spikes at each foot strike
    sway: Math.sin(Math.PI * s / Ls),           // weight shifts side to side
    swing: Math.sin(Math.PI * s / Ls),          // arm swing (opposite to legs)
  };
}
// distance along a walk defined by keys [[t, s], ...] (ease in/out per segment)
function walkS(keys, t) { return track(keys, t, ease); }

// ---- time of day: 0 day … 1 dusk … 2 night --------------------------------------
const tod = t => t < 38.5 ? 0 : t < 41.5 ? ease((t - 38.5) / 3) : t < 44.5 ? 1 + ease((t - 41.5) / 3) : 2;

// ---- reaching: bend (squash + lean) just enough for the hand to get there --------
function bendFor(who, P, side, target) {
  const [sx, sy] = SH[who], R = reachOf(who) * .94, s = side === 'L' ? -1 : 1;
  for (let e = 0; e <= 1.0001; e += .05) {
    const Q = { ...P, sq: (P.sq || 0) + .26 * e, lean: (P.lean || 0) + s * .42 * e };
    const sw = toWorld(Q, s * sx, sy); if (Math.hypot(target[0] - sw[0], target[1] - sw[1]) <= R * Q.k) return e;
  }
  return 1;
}
// u: 0 rest → 1 at target. Applies bend and returns the hand (local coords).
function reachTo(who, P, side, target, u) {
  if (u <= 0) return null; const e = bendFor(who, P, side, target) * u, s = side === 'L' ? -1 : 1;
  P.sq = (P.sq || 0) + .26 * e; P.lean = (P.lean || 0) + s * .42 * e;
  const h = toLocal(P, target[0], target[1]), d = DEF[who][side];
  P.hands = P.hands || {}; P.hands[side] = [lerp(d[0], h[0], u), lerp(d[1], h[1], u)];
  return P.hands[side];
}
const handW = (P, side) => toWorld(P, P.hands[side][0], P.hands[side][1]);
// a cup held in a hand: rim sits above the mitten so the hand reads as gripping it
function holdCup(P, side, tilt = 0, fill = .7, hr = 24) { const k = P.k, w = CUPW / k; P.hold = P.hold || {}; P.hold[side + '0'] = (g, hx, hy) => { g.save(); g.translate(hx, hy - hr * .35); g.rotate(tilt); drawCup(g, 0, -w * .7, w, 0, fill); g.restore(); }; }  // mitten grips the cup's base

// ---- the herb bundle 何首烏 brings --------------------------------------------------
function drawBundle(ctx, x, y, s, rot = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  for (const [dx, a] of [[-10, -.5], [0, 0], [10, .5]]) { const r = new Path2D(); r.ellipse(dx * .6, -18, 7, 22, a * .5, 0, 7); fillShade(ctx, r, '#7a4a2a', { grain: .25 }); ink(ctx, r, 2); }
  for (const a of [-.7, .7]) drawGinkgo(ctx, a * 10, -36, 18, a, '#93a24e', { detail: false });
  ctx.strokeStyle = '#c4553e'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-12, -12); ctx.lineTo(12, -12); ctx.stroke();
  ctx.restore();
}

// =================================================================================
// CAST: every character's pose at time t
// =================================================================================
function seatP(w, t, extra = {}) { const [x, y, k] = SEAT[w]; const P = { x, y, k, cape: 'on', tt: t, ...extra }; return P; }

  const W0 = WALKS[w], n = walkN(w, t), o = W0.o || {}, nTot = W0.keys[W0.keys.length - 1][1];
  const Ls = 2 * HIP[w] * k * (o.stride || 1); const P = { x: x1 - nTot * Ls, y, k, cape: 'on', tt: t };
  walkPose(w, P, n, 1, walkMoving(w, t), o); return P;
}
function settle(P, id, t) { const p = prog(id, t); if (p > 0) P.sq = (P.sq || 0) + hump(p) * .1 + ease(p) * .03; }
function lookUp(P, t, seed) { P.eye = face(1, Math.sin(t * .4 + seed) * .4, -.95); P.turn = 0; }
function fwBoomAt(t) { let f = 0; for (let i = 0; i < 9; i++) { const d = t - ACT['fw' + i].t - 1; if (d > 0 && d < 1.8) f = Math.max(f, 1 - d / 1.8); } return f; }

function castAt(t) {

      if (dk > 0) { tilt = sipPose('gui', P, 'R', hump(dk)); if (dk > .2 && dk < .85) { P.eye = face(0, 0, 0, 'closed'); P.mouth = { shape: 'o', open: .2 }; } } if (t > ACT['c.drink'].t + 1.2) happy(P, .8); }

    P.sway = (P.sway || 0) + Math.sin(t * 1.1) * .3; P.crown = Math.sin(t * 1.4) * .01 + spring(t, ACT['sit.gui'].t + .3, .04);

    if (t < WALKS.qi.keys[1][0]) { P = walker('qi', t, SEAT.qi[0], SEAT.qi[1], SEAT.qi[2]); P.turn = .4; P.eye = face(1, .7, -.1, 'n'); P.mouth = { shape: 'open', open: .4 }; P.knot = Math.sin(t * 9) * .8; }
    else P = seatP('qi', t);

<script>
(async () => {
  const params = new URLSearchParams(location.search);
  const RANGE = [0, 60];
  const t0 = parseFloat(params.get('from') ?? RANGE[0]), t1 = parseFloat(params.get('to') ?? RANGE[1]);
  const cv = document.getElementById('c'), seek = document.getElementById('seek'), btn = document.getElementById('play'), tl = document.getElementById('time');
  seek.min = t0; seek.max = t1; seek.value = t0;
  await FILM.init(cv); document.getElementById('loading').remove();
  let playing = false, ac = null, src = null, startAt = 0, offset = t0, buf = null;
  const show = t => { FILM.frame(t); tl.textContent = t.toFixed(2) + ' / ' + t1.toFixed(2); };
  show(t0 + 0.001);
  window.FILM = FILM;
  async function ensureAudio() {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: AUDIO_SR });
    if (!buf) { btn.textContent = '…'; await new Promise(r => setTimeout(r, 20)); const a = synthAudio(); buf = ac.createBuffer(2, a.L.length, AUDIO_SR); buf.copyToChannel(a.L, 0); buf.copyToChannel(a.R, 1); }
  }
  function now() { return playing ? offset + (ac.currentTime - startAt) : offset; }
  async function play() {
    await ensureAudio(); await ac.resume();
    if (offset >= t1 - .05) offset = t0;
    src = ac.createBufferSource(); src.buffer = buf; const g = ac.createGain(); g.gain.value = 1; src.connect(g).connect(ac.destination);
    startAt = ac.currentTime + .05; src.start(startAt, offset, t1 - offset); playing = true; btn.textContent = 'Pause';
    const loop = () => { if (!playing) return; const t = now(); if (t >= t1) { stop(); offset = t1; show(t1 - .001); return; } seek.value = t; show(Math.max(t0, t)); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
  function stop() { if (src) { try { src.stop(); } catch (e) {} src = null; } offset = now(); playing = false; btn.textContent = 'Play'; }
  btn.onclick = () => playing ? stop() : play();
  seek.oninput = () => { const was = playing; if (was) stop(); offset = parseFloat(seek.value); show(offset); if (was) play(); };
  document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); btn.click(); } });
})();
