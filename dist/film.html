<style>

  button { background: var(--ink); color: var(--panel); border: 0; border-radius: 6px; padding: 6px 12px; font-weight: 600; cursor: pointer; min-width: 64px; }
  input[type=range] { flex: 1; accent-color: #c98a2a; }
  #time { font-variant-numeric: tabular-nums; color: var(--mute); min-width: 92px; text-align: right; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #7a3f1d; background: #f7ecd8; font-size: 18px; }

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => (t = clamp(t), t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
const easeIn = t => Math.pow(clamp(t), 3);

// ---- camera -------------------------------------------------------------------
// cam = {x, y, z}: world point at screen centre and zoom
function picnicCam(t) {
  const K = [
    // shot 04: slow push across the picnic
    [20.0, 660, 1500, 1.42], [28.0, 690, 1510, 1.52],
    // shot 05: hold on the bowl, a gentle drift toward the grass
    [28.0, 965, 1612, 2.9], [37.0, 985, 1606, 2.95],
    // shot 06
    [37.0, 842, 1592, 2.08], [46.0, 852, 1592, 2.14],
  ];
  if (t < 28) { const a = K[0], b = K[1], u = ease((t - a[0]) / (b[0] - a[0])); return { x: lerp(a[1], b[1], u), y: lerp(a[2], b[2], u), z: lerp(a[3], b[3], u) }; }
  if (t < 37) { const a = K[2], b = K[3], u = ease((t - a[0]) / (b[0] - a[0])); return { x: lerp(a[1], b[1], u), y: lerp(a[2], b[2], u), z: lerp(a[3], b[3], u) }; }
  if (t < 46) { const a = K[4], b = K[5], u = ease((t - a[0]) / (b[0] - a[0])); return { x: lerp(a[1], b[1], u), y: lerp(a[2], b[2], u), z: lerp(a[3], b[3], u) }; }
  if (t < 54) {
    // shot 07: close on 豆豆 → follow steam up → pull back to the wide
    const s0 = { x: 935, y: 1590, z: 3.0 };
    const drift = { x: 935, y: 1584, z: 3.08 };
    const u0 = clamp((t - 46) / 4.8);
    let c = { x: lerp(s0.x, drift.x, u0), y: lerp(s0.y, drift.y, u0), z: lerp(s0.z, drift.z, u0) };
    const us = ease(prog('cam.steam', t)); // tilt up with the steam
    c = { x: c.x, y: c.y - us * 150, z: c.z };
    const up = prog('cam.pull', t), e = ease(up);
    // zoom in log-space so the pull-back feels even
    const z = Math.exp(lerp(Math.log(c.z), Math.log(WIDE.z), e));
    return { x: lerp(c.x, WIDE.x, e), y: lerp(c.y, WIDE.y, e), z };
  }
  // shot 08: hold wide with a whisper of drift

  return { x: WIDE.x, y: WIDE.y - u * 6, z: WIDE.z + u * .015 };
}
function layerTransform(ctx, cam, f) {
  const zf = 1 + (cam.z - 1) * f, cx = 540 + (cam.x - 540) * f, cy = 960 + (cam.y - 960) * f;
  ctx.setTransform(zf, 0, 0, zf, W / 2 - cx * zf, H / 2 - cy * zf);

}

  layerTransform(ctx, cam, l.f);

  ctx.drawImage(l.c, l.R.x, l.R.y, l.R.w, l.R.h);

// ---- characters over time --------------------------------------------------------
function wuState(t) {
  const shift = ease(prog('w.shift', t));
  const hop = Math.abs(Math.sin(prog('w.shift', t) * Math.PI * 2)) * (prog('w.shift', t) > 0 && prog('w.shift', t) < 1 ? 1 : 0);
  let x = lerp(738, 698, shift), lift = hop * 10, sq = -hop * .04 + (t > 37 && t < 54 ? .01 * Math.sin(t * 2.1) : .012 * Math.sin(t * 2.1));
  // arm: rest raised (-0.6) → reach (+1.05, long) → two pats → rest
  const reach = ease(prog('w.reach', t)), rest = ease(prog('w.rest', t));
  const pat = p => p > 0 && p < 1 ? Math.sin(p * Math.PI) : 0;
  const p1 = pat(prog('w.pat1', t)), p2 = pat(prog('w.pat2', t));
  const lift2 = (p1 + p2); // paw lifts between pats
  let arm = lerp(-0.6, 1.02, reach), len = lerp(1, 1.62, reach), lean = lerp(0, .2, reach);
  arm -= lift2 * .3; lean -= lift2 * .03;
  arm = lerp(arm, -0.6, rest); len = lerp(len, 1, rest); lean = lerp(lean, 0, rest);
  // final shot: cheer arm gently waves
  if (t > 52) arm += Math.sin((t - 52) * 2.4) * .12 * smooth(52, 53.5, t);
  return { x, y: 1655, h: 228, pose: { arm, len, lean, sq, lift } };
}
function douState(t) {

  let x = PIC.hide.x, y = PIC.hide.y; const h = 165;
  // 05: hidden → peek out from behind the grass
  const peek = ease(prog('b.peek', t)), hide = ease(prog('b.hide', t));
  let pk = peek * (1 - hide * .45);
  x = PIC.hide.x - pk * 50; st.lean = -pk * .14; st.lift = -(1 - pk) * 95; st.hidden = t < ACT['b.step'].t;
  if (t >= 33.6 && t < 35.5) { st.eyesK = 0; }
  // 06: step forward to the seat and sit
  const step = prog('b.step', t), sit = ease(prog('b.sit', t));
  if (t >= ACT['b.step'].t) {
    const e = ease(step);
    const sx = PIC.hide.x - 50 * .55, sy = PIC.hide.y;
    x = lerp(sx, PIC.seat.x, e); y = lerp(sy, PIC.seat.y, e);
    st.walk = step < 1 ? step * 3 : null; st.lift = step < 1 ? Math.abs(Math.sin(step * Math.PI * 3)) * 9 : 0;
    st.lean = lerp(-.06, 0, e) + (step < 1 ? Math.sin(step * Math.PI * 6) * .05 : 0);
  }
  if (t >= ACT['b.sit'].t) { st.sit = sit; st.sq = hump(prog('b.sit', t)) * .09 + sit * .03; st.walk = null; st.lift = 0; }
  // 07: blanket loosens into the lap, then two-hand bowl pickup
  const lo = ease(prog('b.loosen', t)); st.blanket = lo;
  const c = douBlanketCorners(lo);
  let hands = [[c.tl[0] + .03, c.tl[1] + .01], [c.tr[0] - .03, c.tr[1] + .01]];
  const reach = ease(prog('b.reach', t)), lift = ease(prog('b.lift', t));
  st.bowl = null;
  if (t >= ACT['b.reach'].t) {
    // bowl position in world: on coaster until lift, then up to the chest
    const B = PIC.bowl; const chest = douToWorld(x, y, h, st, -0.03, -0.36);
    const bx = lerp(B.x, chest[0], lift), by = lerp(B.y, chest[1], lift) - hump(lift) * 8;
    st.bowl = { x: bx, y: by };
    st.sq += reach * (1 - lift) * .06; // bends toward the bowl
    const lb = worldToDou(x, y, h, st, bx - B.w * .46, by + B.w * .2), rb = worldToDou(x, y, h, st, bx + B.w * .46, by + B.w * .2);

function renderPicnic(ctx, t) {

  drawLayer(ctx, cam, L.ground, 0);

    g.globalCompositeOperation = 'destination-in'; g.fillStyle = m; g.fillRect(0, 0, W, H); g.globalCompositeOperation = 'source-over';
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = `blur(${blurPx.toFixed(2)}px)`; ctx.drawImage(buf, 0, 0); ctx.filter = 'none';

}

  const landT = ACT['c.leaf'].t + ACT['c.leaf'].d;
  if (t >= landT) { sq = .45; rot = Math.PI + 2.75 + dr * 1.2; lx = 580 + dr * 520 + Math.sin(t * 1.2) * 6; ly = 1230 + dr * 420; }
  ripples(ctx, 580, 1240, t - landT, 1.5, dr * 520, dr * 420);

  drawGinkgo(ctx, lx, ly, 170, rot, '#f6c83e', { squash: sq, tip: '#fbe07a' });

function ripples(ctx, x, y, dt, s, ox = 0, oy = 0) {

// ---------- shot 02 ----------
const PATHB = { P: { x: 1010, y: 800 }, len: 900 };
function pathWu(t) {
  const reach = ease(prog('p.reach', t)), lift = ease(prog('p.lift', t)), lower = ease(prog('p.lower', t));
  let arm = lerp(-0.6, -0.9, reach), len = lerp(1, 1.4, reach);
  arm = lerp(arm, -1.57, lift); len = lerp(len, 2.0, lift);
  arm = lerp(arm, -0.6, lower); len = lerp(len, 1, lower);
  const lean = lerp(0, .05, reach) - lift * .03 + lower * .0; const lift2 = lift * 30 * (1 - lower);
  return { x: 260, y: 1560, h: 430, pose: { arm, len, lean, sq: .01 * Math.sin(t * 2), lift: lift2 } };
}
function branchAngle(t) {
  const P = PATHB.P;
  const reachPose = { arm: -0.9, len: 1.4, lean: .05 };
  const F1 = wuFist(260, 1560, 430, reachPose); const rest = Math.atan2(F1[1] - P.y, F1[0] - P.x);
  const w = pathWu(t); const F = wuFist(w.x, w.y, w.h, w.pose); const held = Math.atan2(F[1] - P.y, F[0] - P.x);
  const holding = t >= ACT['p.reach'].t + ACT['p.reach'].d && t < ACT['p.lower'].t + ACT['p.lower'].d * .6;
  let a = holding ? held : rest;
  const rel = ACT['p.lower'].t + ACT['p.lower'].d * .6;
  if (t >= rel) { const d = t - rel, from = held; a = rest + (Math.atan2(wuFist(260, 1560, 430, pathWu(rel).pose)[1] - P.y, wuFist(260, 1560, 430, pathWu(rel).pose)[0] - P.x) - rest) * Math.exp(-d * 3) * Math.cos(d * 9); }
  return a + Math.sin(t * 1.4) * .006;
}
function drawBranch(ctx, a) {
  const P = PATHB.P; ctx.save(); ctx.translate(P.x, P.y); ctx.rotate(a);
  ctx.strokeStyle = '#6e4a2c'; ctx.lineCap = 'round'; ctx.lineWidth = 20; ctx.beginPath(); ctx.moveTo(-40, 0); ctx.quadraticCurveTo(PATHB.len * .5, -18, PATHB.len, 6); ctx.stroke();
  ctx.lineWidth = 3; ctx.strokeStyle = PAL.siennaD; ctx.globalAlpha = .5; ctx.beginPath(); ctx.moveTo(-40, 9); ctx.quadraticCurveTo(PATHB.len * .5, -9, PATHB.len, 14); ctx.stroke(); ctx.globalAlpha = 1;
  const r = mulberry32(611);
  ctx.lineWidth = 6; ctx.strokeStyle = '#6e4a2c'; for (let i = 0; i < 6; i++) { const u = .2 + i * .13; ctx.beginPath(); ctx.moveTo(PATHB.len * u, -10 * Math.sin(u * Math.PI)); ctx.lineTo(PATHB.len * u + 40, (i % 2 ? -1 : 1) * 50); ctx.stroke(); }
  for (let i = 0; i < 44; i++) { const u = .12 + r() * .82, x = PATHB.len * u + (r() - .5) * 40, y = -14 * Math.sin(u * Math.PI) + (r() - .4) * 90; drawGinkgo(ctx, x, y, 46 + r() * 30, Math.PI - a + (r() - .5) * 1.6, ['#f4c63c', '#f8d867', '#e9a92c', '#fbe28a'][i % 4]); }
  ctx.restore();
}
function renderPath(ctx, t) {
  const u = clamp((t - 6) / 7), s = 1.02 + u * .03;
  drawPlane(ctx, EARLY.pathBack, -u * 14, 0, s);
  ctx.setTransform(s, 0, 0, s, W / 2 * (1 - s) - u * 20, H / 2 * (1 - s));
  fallingLeaves(ctx, t, 8, 81, { x: -80, y: -100, w: 1200, h: 1900 }, 1.2);
  // 山山 walks up the path, passes under the lifted branch, bows thanks
  const T0 = ACT['p.walk'].t, Tb = ACT['p.bow'].t, Tb1 = Tb + ACT['p.bow'].d, T1 = T0 + ACT['p.walk'].d;
  let uu = 0; if (t > T0) uu = t < Tb ? .58 * ease((t - T0) / (Tb - T0)) : t < Tb1 ? .58 : .58 + .42 * ease((t - Tb1) / (T1 - Tb1));

  ctx.fillStyle = g; ctx.save(); ctx.translate(W / 2, y); ctx.scale(1, .3); ctx.beginPath(); ctx.arc(0, 0, 520, 0, 7); ctx.restore(); ctx.fill();
  ctx.font = '700 66px "TitleTC"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(255,250,238,.95)'; ctx.lineWidth = 12; ctx.strokeText(TITLE, W / 2, y);
  ctx.fillStyle = '#6b3415'; ctx.fillText(TITLE, W / 2, y);
  // small ginkgo ornament
  drawGinkgo(ctx, W / 2, y + 74, 30, Math.PI, '#e9b13a', {});
  ctx.restore();
}

// ---------------------------------------------------------------------------
// Player + export API
// ---------------------------------------------------------------------------
const FILM = {
  ready: false, canvas: null, ctx: null,
  async init(canvas) {
    this.canvas = canvas; this.ctx = canvas.getContext('2d');
    await loadImages(ASSETS.images);
    const f = new FontFace('TitleTC', `url(${ASSETS.font})`, { weight: '700' }); await f.load(); document.fonts.add(f);
    initTextures(); buildPicnicLayers(); if (typeof buildEarlyLayers === 'function') buildEarlyLayers();
    this.ready = true;
  },
  frame(t) { render(this.ctx, t); },
  frameJPEG(i, q = .93) { render(this.ctx, i / FPS); return this.canvas.toDataURL('image/jpeg', q).split(',')[1]; },
};

</script>
<script>
(async () => {
  const params = new URLSearchParams(location.search);
  const RANGE = [0, 60];
  const t0 = parseFloat(params.get('from') ?? RANGE[0]), t1 = parseFloat(params.get('to') ?? RANGE[1]);
  const cv = document.getElementById('c'), seek = document.getElementById('seek'), btn = document.getElementById('play'), tl = document.getElementById('time');
  seek.min = t0; seek.max = t1; seek.value = t0;
  await FILM.init(cv); document.getElementById('loading').remove();
  let playing = false, ac = null, src = null, startAt = 0, offset = t0, buf = null;
  const show = t => { FILM.frame(t); tl.textContent = t.toFixed(2) + ' / ' + t1.toFixed(2); };
  show(t0 + 0.001);
  window.FILM = FILM;
  async function ensureAudio() {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: AUDIO_SR });
    if (!buf) { btn.textContent = '…'; await new Promise(r => setTimeout(r, 20)); const a = synthAudio(); buf = ac.createBuffer(2, a.L.length, AUDIO_SR); buf.copyToChannel(a.L, 0); buf.copyToChannel(a.R, 1); }
  }
  function now() { return playing ? offset + (ac.currentTime - startAt) : offset; }
  async function play() {
    await ensureAudio(); await ac.resume();
    if (offset >= t1 - .05) offset = t0;
    src = ac.createBufferSource(); src.buffer = buf; const g = ac.createGain(); g.gain.value = 1; src.connect(g).connect(ac.destination);
    startAt = ac.currentTime + .05; src.start(startAt, offset, t1 - offset); playing = true; btn.textContent = 'Pause';
    const loop = () => { if (!playing) return; const t = now(); if (t >= t1) { stop(); offset = t1; show(t1 - .001); return; } seek.value = t; show(Math.max(t0, t)); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
  function stop() { if (src) { try { src.stop(); } catch (e) {} src = null; } offset = now(); playing = false; btn.textContent = 'Play'; }
  btn.onclick = () => playing ? stop() : play();
  seek.oninput = () => { const was = playing; if (was) stop(); offset = parseFloat(seek.value); show(offset); if (was) play(); };
  document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); btn.click(); } });
})();
</script>
